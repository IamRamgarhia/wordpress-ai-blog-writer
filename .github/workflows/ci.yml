name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer lint

  # The translation template is generated from the source, so it silently goes
  # stale every time a string is added. It had drifted to 61% coverage before
  # anyone noticed, which a translator would experience as half a screen still
  # in English. This fails the build instead.
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check languages/blogcraft.pot is current
        run: python bin/makepot.py --check

  # Syntax-checks every PHP file across the full supported PHP range. This
  # catches parse errors per version but cannot catch runtime deprecation
  # notices (e.g. PHP 8.5 notices that phpunit.xml.dist's
  # convertNoticesToExceptions turns into failures) — the `test` job below
  # covers that by actually running the suite.
  lint-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --prefer-dist --no-progress
      # php -l exits 0 on a deprecation — it only fails on parse errors, so
      # this matrix was proving the code parses on 8.4 and 8.5 and nothing
      # more. Anything PHP has to say about a file is now a failure, which is
      # what makes the two newest columns worth running.
      - name: Lint for syntax errors and deprecations
        run: |
          set -eu
          found=0
          while IFS= read -r -d '' file; do
            out=$(php -d error_reporting=E_ALL -d display_errors=1 -l "$file" 2>&1) || { echo "$out"; found=1; continue; }
            if [ "$out" != "No syntax errors detected in $file" ]; then
              echo "$out"
              found=1
            fi
          done < <(find . -path ./vendor -prune -o -name '*.php' -print0)
          exit "$found"

  # Actually runs the PHPUnit suite against a real WordPress install via
  # wp-env, on a single PHP configuration (matching .wp-env.json). Not run
  # across the full PHP matrix — wp-env manages one containerised PHP
  # version at a time and a multi-version wp-env matrix is out of scope.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: npm ci
      - run: composer install --prefer-dist --no-progress
      - run: npx wp-env start
      - name: Run PHPUnit inside wp-env
        run: npx wp-env run tests-cli --env-cwd=wp-content/plugins/blogcraft -- vendor/bin/phpunit
